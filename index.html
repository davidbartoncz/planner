<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<title>Plánek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plánek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#ECEAE4; --ink:#17181C; --ink-2:#5E5F66; --ink-3:#8A8B92;
  --line:#E2E0D9; --ring:#B9B8B1;
  --pri-bg:#17181C; --pri-fg:#FFFFFF; --lime:#D6F06A; --on-lime:#17181C;
  --dark:#1B1C21; --dark-2:#3A3B42; --on-dark:#FFFFFF; --on-dark-2:#B4B5BC;
  --check-bg:#17181C; --check-fg:#D6F06A;
  --danger:#B4361F; --danger-soft:#FBDCD4; --warn:#8F5200; --warn-soft:#FFE6C6; --ok:#2E7D4F; --info-soft:#EAF6BE;
  --c-prace:#C9CEFF; --c-skola:#FFD3B6; --c-domov:#CDEFD9; --c-none:#E4E2DC; --c-ink:#17181C; --c-ink-2:#3E3F46;
  --shadow:0 12px 36px rgba(23,24,28,.18);
  --display:'Bricolage Grotesque', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --surface:#1E1F24; --surface-2:#2A2B31; --ink:#F2F1ED; --ink-2:#A9AAB1; --ink-3:#7E7F87;
    --line:#2F3037; --ring:#62636B;
    --pri-bg:#D6F06A; --pri-fg:#17181C;
    --dark:#26272D; --dark-2:#3E3F46; --on-dark:#FFFFFF; --on-dark-2:#B4B5BC;
    --check-bg:#D6F06A; --check-fg:#17181C;
    --danger:#FF9580; --danger-soft:#3F231D; --warn:#F4B657; --warn-soft:#3B2D17; --ok:#7AD39C; --info-soft:#2F3618;
    --c-prace:#3C417F; --c-skola:#6F452F; --c-domov:#2D5B41; --c-none:#34353B; --c-ink:#F2F1ED; --c-ink-2:#D4D3CF;
    --shadow:0 12px 36px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1E1F24; --surface-2:#2A2B31; --ink:#F2F1ED; --ink-2:#A9AAB1; --ink-3:#7E7F87;
  --line:#2F3037; --ring:#62636B;
  --pri-bg:#D6F06A; --pri-fg:#17181C;
  --dark:#26272D; --dark-2:#3E3F46; --on-dark:#FFFFFF; --on-dark-2:#B4B5BC;
  --check-bg:#D6F06A; --check-fg:#17181C;
  --danger:#FF9580; --danger-soft:#3F231D; --warn:#F4B657; --warn-soft:#3B2D17; --ok:#7AD39C; --info-soft:#2F3618;
  --c-prace:#3C417F; --c-skola:#6F452F; --c-domov:#2D5B41; --c-none:#34353B; --c-ink:#F2F1ED; --c-ink-2:#D4D3CF;
  --shadow:0 12px 36px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.filled{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:600px;margin:0 auto}
.disp{font-family:var(--display);letter-spacing:-.02em}

/* kategorie */
.a-prace{--cat:var(--c-prace)} .a-skola{--cat:var(--c-skola)} .a-domov{--cat:var(--c-domov)} .a-none{--cat:var(--c-none)}
.adot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--cat,var(--c-none));border:1.5px solid var(--ink)}
.cat{display:inline-flex;align-items:center;background:var(--cat,var(--c-none));color:var(--c-ink);font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}

/* hlavička */
.top .wrap{padding:14px 20px 4px;display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.top h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:0}
.top .sub{font-size:13px;color:var(--ink-2)}
.top .greet{font-size:16px;font-weight:600}
.top .tools{display:flex;gap:8px;align-items:center}
.circ{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;position:relative}
.circ svg{width:20px;height:20px}
.circ.dark{background:var(--pri-bg);color:var(--pri-fg)}
.circ .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#E5533D;border:2px solid var(--surface)}
.pill{height:44px;padding:0 16px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center}

main{padding:4px 20px calc(130px + env(safe-area-inset-bottom,0px))}
section.block{margin:24px 0 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0}
.sec-h .link{font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.sec-h .n{font-size:13px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* velký nadpis dne */
.headline{font-family:var(--display);font-size:34px;line-height:1.18;font-weight:700;letter-spacing:-.02em;margin:18px 0 0}
.headline .num{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:42px;padding:0 14px;border-radius:21px;background:var(--lime);color:var(--on-lime);margin-right:8px;vertical-align:middle}

/* tmavá karta postupu */
.prog{margin-top:22px;background:var(--dark);color:var(--on-dark);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.prog .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prog .lbl{font-size:13px;color:var(--on-dark-2)}
.prog .big{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.01em;display:block}
.prog .pct{background:var(--lime);color:var(--on-lime);font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;white-space:nowrap}
.bars-seg{display:flex;gap:6px}
.bars-seg i{flex:1;height:10px;border-radius:5px;background:var(--dark-2)}
.bars-seg i.on{background:var(--lime)}
.prog .next{display:flex;align-items:center;gap:8px;font-size:13px;color:#D6D7DC}
.prog .next svg{width:16px;height:16px}
.prog .btn.lime{align-self:flex-start}

/* seznam karet */
.list{display:flex;flex-direction:column;gap:8px}
.card-row{background:var(--surface);border-radius:22px;padding:10px 12px 10px 6px;display:flex;align-items:center;gap:6px;min-height:64px;width:100%;text-align:left;color:var(--ink)}
.card-row.tap{cursor:pointer}
.card-row:active{filter:brightness(.97)}
.card-row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:2px 0}
.card-row .title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row .title.wrapt{white-space:normal;overflow-wrap:anywhere}
.card-row.no-check{padding-left:16px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px;stroke-width:2.2}
.meta .late{color:var(--danger);font-weight:600}
.meta .soon{color:var(--warn);font-weight:600}
.done-t .title{text-decoration:line-through;color:var(--ink-3)}
.go{width:44px;height:44px;border-radius:50%;background:var(--pri-bg);color:var(--pri-fg);display:grid;place-items:center;flex:none}
.go svg{width:18px;height:18px}
.go.light{background:var(--bg);color:var(--ink)}

/* odškrtávání */
.check{width:44px;height:44px;display:grid;place-items:center;flex:none;position:relative}
.check::before{content:"";position:absolute;inset:0;margin:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--ring);box-sizing:border-box}
.check svg{position:relative;width:15px;height:15px;stroke-width:3;opacity:0;color:var(--check-fg)}
.check.on::before{background:var(--check-bg);border-color:var(--check-bg)}
.check.on svg{opacity:1}
.check.sm::before{width:24px;height:24px}
/* klasické skupiny (formuláře, nastavení) */
.group{background:var(--surface);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;position:relative}
.row + .row::before,.field + .field::before,.step-row + .step-row::before,.sess + .sess::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--line)}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .meta{margin-top:3px}
.chev{color:var(--ink-3)}
.chev svg{width:18px;height:18px}
.star-btn{width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.star-btn.on{color:var(--ink)}
.star-btn.on svg{fill:var(--lime);stroke:var(--ink)}
.mark{background:linear-gradient(transparent 55%,var(--lime) 55%,var(--lime) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px;margin:0 -2px}
:root[data-theme="dark"] .mark{color:var(--ink);background:linear-gradient(transparent 60%,rgba(214,240,106,.45) 60%,rgba(214,240,106,.45) 92%,transparent 92%)}
.mit-num{font-family:var(--display);font-weight:800;font-size:15px;width:28px;height:28px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;flex:none;margin-left:8px}

/* tlačítka */
.btn{min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--ink)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--pri-bg);color:var(--pri-fg)}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;padding:0 12px}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.btn.big{min-height:58px;font-size:16px}
.btn .ic{width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
.btn .ic svg{width:15px;height:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.card-row .btn:not(.primary):not(.lime),.card .btn:not(.primary):not(.lime):not(.danger){background:var(--bg)}

/* karty, bannery */
.card{background:var(--surface);border-radius:22px;padding:16px}
.card h3{font-family:var(--display);font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.card p{margin:0 0 12px;color:var(--ink-2)}
.banner{border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-top:12px;color:var(--c-ink)}
.banner .main{flex:1;min-width:0}
.banner .small{color:var(--c-ink-2)}
.banner.warn{background:var(--c-skola)}
.banner.info{background:var(--info-soft);color:var(--ink)}
.banner.info .small{color:var(--ink-2)}
.banner strong{display:block;font-weight:600}
.note{background:var(--surface);border-radius:22px;padding:12px 16px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.note .bul{width:8px;height:8px;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);margin-top:7px;flex:none}

/* čipy */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none;margin:0 -20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg)}
.chip .n{font-size:12px;font-weight:500;opacity:.7}
.search{width:100%;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 18px;margin:8px 0 12px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* týdenní pás */
.week{margin-top:18px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{height:72px;border-radius:22px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.wd small{font-size:12px;font-weight:500;color:var(--ink-2)}
.wd b{font-family:var(--display);font-size:19px;font-weight:700}
.wd i{width:6px;height:6px;border-radius:50%;background:transparent}
.wd i.has{background:var(--ink)}
.wd i.dl{background:#E5533D}
.wd.on{background:var(--pri-bg);color:var(--pri-fg)}
.wd.on small{color:inherit;opacity:.7}
.wd.on i.has{background:var(--lime)}
.wd.today:not(.on){box-shadow:inset 0 0 0 2px var(--ink)}
.stats{margin-top:16px;background:var(--surface);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{font-family:var(--display);font-size:20px;font-weight:700;display:block;line-height:1.2}
.stats span{font-size:12px;color:var(--ink-2)}
.stats .over b{color:var(--danger)}

/* agenda dne */
.ag{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.ag-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:start}
.ag-t{font-size:12px;color:var(--ink-2);padding-top:15px;font-variant-numeric:tabular-nums}
.ag-blk{border-radius:20px;padding:12px 14px 12px 4px;display:flex;align-items:center;gap:6px;background:var(--cat,var(--surface));color:var(--c-ink);width:100%;text-align:left;cursor:pointer;min-height:60px}
.ag-blk.done{background:var(--surface);color:var(--ink)}
.ag-blk .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ag-blk .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-blk.done .title{text-decoration:line-through;color:var(--ink-3)}
.ag-blk .meta{color:var(--c-ink-2)}
.ag-blk.done .meta{color:var(--ink-2)}
.ag-blk .check:not(.on)::before{border-color:var(--c-ink)}
.ag-blk.big{border-radius:24px;padding:14px 14px 14px 16px;flex-direction:column;align-items:stretch;gap:10px}
.ag-blk.big .pills{display:flex;gap:6px;flex-wrap:wrap}
.ag-blk.big .pills span{font-size:12px;font-weight:600;background:var(--surface);color:var(--ink);padding:3px 9px;border-radius:999px}
.ag-blk.big .pills span.dk{background:var(--pri-bg);color:var(--pri-fg)}
.ag-blk.big .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ag-blk.big .title{font-family:var(--display);font-size:19px;font-weight:700;white-space:normal}
.ag-now{display:flex;align-items:center}
.ag-now .d{width:10px;height:10px;border-radius:50%;background:var(--ink);flex:none}
.ag-now .l{flex:1;height:2px;background:var(--ink)}
.ag-now .p{font-size:11px;font-weight:700;background:var(--lime);color:var(--on-lime);padding:3px 8px;border-radius:999px;margin-left:6px}
.ag-now-t{font-weight:700;color:var(--ink);padding-top:0;align-self:center}
.ag-gap{border:1.5px dashed var(--ring);background:transparent;border-radius:20px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;color:var(--ink)}
.ag-gap .p{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--surface);padding:8px 12px;border-radius:999px;flex:none}
.ag-gap .p svg{width:14px;height:14px;stroke-width:2.4}
.ag-gap b{display:block;font-size:14px;font-weight:600}
.ag-fix{border-radius:20px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2);background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);border:1px solid var(--line)}
.ag-fix b{color:var(--ink);font-weight:600}
.ag-fix.cont{background:none;border:1.5px solid var(--cat);border-left-width:6px}
.fixed-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.fixed-line .link{font-weight:600;min-height:40px;flex:none;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.cap-note{margin:10px 2px 0;font-size:13px;font-weight:600}
.cap-note.bad{color:var(--danger)}
.cap-note.warn{color:var(--warn)}

/* týden (14 dní) */
.day-card{background:var(--surface);border-radius:22px;padding:12px 16px;margin-bottom:8px}
.day-card.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day-head{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left}
.day-head .dn{font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.day-head .dl{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mini-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px 0 8px}
.mini-bar i{display:block;height:100%;background:var(--ink)}
.mini-bar.over i{background:var(--danger)}
.day-items{list-style:none;margin:0;padding:0;font-size:14px}
.day-items li{display:flex;gap:8px;align-items:center;padding:4px 0}
.day-items li .adot{width:9px;height:9px}
.day-items li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-items li.dl{color:var(--danger);font-weight:600}
.day-items li.dn{color:var(--ink-3);text-decoration:line-through}

/* matice */
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.q{background:var(--surface);border-radius:22px;padding:12px 12px 8px;min-height:190px;display:flex;flex-direction:column}
.q1{--qc:#E5533D} .q2{--qc:var(--lime)} .q3{--qc:var(--c-skola)} .q4{--qc:var(--c-none)}
.q h3{font-family:var(--display);font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
.q h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--qc);border:1.5px solid var(--ink);flex:none}
.q .qs{font-size:12px;color:var(--ink-2);margin:2px 0 6px}
.q ul{list-style:none;margin:0;padding:0;flex:1}

.blkrow{background:var(--surface);border-radius:20px;padding:10px 14px 10px 4px;display:flex;align-items:center;gap:6px;width:100%;text-align:left;min-height:60px;color:var(--ink)}

/* soustředění */
.focus{position:fixed;inset:0;z-index:60;background:#17181C;color:#FFFFFF;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:70;background:#17181C;color:#FFFFFF;padding:8px 8px 8px 18px;border-radius:999px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:14px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#17181C;background:#D6F06A;font-weight:700;min-height:36px;padding:0 12px;border-radius:999px;flex:none}

.empty{text-align:center;padding:28px 18px;color:var(--ink-2)}

.tips p{margin:0 0 10px;color:var(--ink-2)}

.sheet-root.static .sheet,.sheet-root.static .backdrop{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (max-width:360px){.headline{font-size:29px}.tab{width:54px}.top h1{font-size:28px}}

<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="fade" aria-hidden="true"></div>
<nav class="nav" id="tabs" aria-label="Hlavní navigace"></nav>
<div class="sheet-root" id="sheet" role="dialog" aria-modal="true"></div>
<div class="focus" id="focus" role="dialog" aria-modal="true" aria-label="Soustředění"></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ===================== utility ===================== */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dkey(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toMin = hm => { if (!hm) return 0; const [h, m] = hm.split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtDur = m => { m = Math.round(m || 0); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} h ${r} min` : `${h} h`; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const DAYS = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];
const DAYS_LONG = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
const MONTHS_GEN = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
function plural(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }
function relDay(k) {
  const d = diffDays(todayKey(), k);
  if (d === 0) return 'dnes'; if (d === 1) return 'zítra'; if (d === -1) return 'včera';
  if (d > 1 && d < 7) return DAYS_LONG[parseKey(k).getDay()];
  const x = parseKey(k); return `${x.getDate()}. ${x.getMonth() + 1}.`;
}
function longDate(k) { const x = parseKey(k); return `${DAYS_LONG[x.getDay()]} ${x.getDate()}. ${MONTHS_GEN[x.getMonth()]}`; }
function weekStart(k) { const x = parseKey(k); const wd = (x.getDay() + 6) % 7; return addDays(k, -wd); }

/* ===================== stav ===================== */
const KEY = 'planek.v1';
let S, saveTimer = null, storageOk = true, undoSnap = null, statsCache = null;
function defaults() {
  return {
    v: 1, tasks: [], days: {}, weeks: {}, log: [], focus: null,
    settings: { dayStart: '07:00', dayEnd: '22:00', focusCap: 360, sessionLen: 50, breakLen: 10, bufferDays: 1, pomodoro: 25, shortBreak: 5, theme: 'auto', fixed: [], containerRatio: 70, estCorrect: true },
    meta: { lastWeekly: null, reviewHiddenOn: null }
  };
}
function normalize(d) {
  const b = defaults();
  if (!d || typeof d !== 'object') return b;
  const out = { ...b, ...d, settings: { ...b.settings, ...(d.settings || {}) }, meta: { ...b.meta, ...(d.meta || {}) } };
  out.tasks = (Array.isArray(d.tasks) ? d.tasks : []).map(t => ({ ...newTask(), ...t, steps: t.steps || [], sessions: t.sessions || [] }));
  out.days = d.days || {}; out.weeks = d.weeks || {}; out.log = Array.isArray(d.log) ? d.log : [];
  return out;
}
function load() {
  statsCache = null;
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); }
  catch (e) { storageOk = false; }
  return defaults();
}
function save() {
  statsCache = null;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
    catch (e) { if (storageOk) toast('Data se nepodařilo uložit. Zálohuj je v Více → Data.'); storageOk = false; }
  }, 120);
}
function snap() { undoSnap = JSON.stringify(S); }
function undo() { if (!undoSnap) return; S = normalize(JSON.parse(undoSnap)); undoSnap = null; save(); render(); renderSheet(); }

/* ===================== úkoly ===================== */
const AREAS = { prace: 'Práce', domov: 'Domov', skola: 'Škola' };
const areaCls = a => 'a-' + (a || 'none');
const areaName = a => AREAS[a] || 'Inbox';
function newTask(p = {}) {
  return { id: uid(), title: '', notes: '', area: null, important: false, urgent: false, deadline: null, est: 0, recur: null, steps: [], sessions: [], spent: 0, status: 'open', created: Date.now(), done: null, waitingFor: null, waitingSince: null, followUp: null, ...p };
}
const task = id => S.tasks.find(t => t.id === id);
const openTasks = () => S.tasks.filter(t => t.status === 'open');
const isUrgent = t => !!(t.urgent || (t.deadline && diffDays(todayKey(), t.deadline) <= 2));
const quadrant = t => t.important ? (isUrgent(t) ? 1 : 2) : (isUrgent(t) ? 3 : 4);
const planned = t => sum(t.sessions, s => s.min);
const isWaiting = t => !!(t.waitingFor && String(t.waitingFor).trim());
const activeTasks = () => openTasks().filter(t => !isWaiting(t));
/* --- přesnost odhadů --- */
function estStats(area) {
  statsCache ||= {};
  const key = area || '*';
  if (key in statsCache) return statsCache[key];
  const done = S.tasks.filter(t => t.status === 'done' && t.est > 0 && t.spent > 0 && (!area || t.area === area)).sort((a, b) => b.done - a.done).slice(0, 30);
  let res = null;
  if (done.length >= 5) {
    const r = done.map(t => t.spent / t.est).sort((a, b) => a - b), m = r.length >> 1;
    res = { n: done.length, ratio: r.length % 2 ? r[m] : (r[m - 1] + r[m]) / 2 };
  }
  return statsCache[key] = res;
}
function estFactor(t) {
  if (!S.settings.estCorrect) return 1;
  const s = estStats(t.area) || estStats(null);
  return s ? Math.min(2, Math.max(0.8, s.ratio)) : 1;
}
const effEst = t => t.est ? Math.round(t.est * estFactor(t) / 5) * 5 : 0;
const unplanned = t => t.est ? Math.max(0, effEst(t) - planned(t)) : 0;
/* --- pevný rozvrh a kapacita --- */
const FREE_RATIO = 0.6;
function fixedRaw(k) {
  const wd = parseKey(k).getDay();
  return (S.settings.fixed || []).filter(f => f.days.includes(wd) && toMin(f.to) > toMin(f.from))
    .map(f => ({ ...f, a: toMin(f.from), b: toMin(f.to) })).sort((x, y) => x.a - y.a);
}
const fixedFor = k => peekDay(k).noFixed ? [] : fixedRaw(k);
const containerAreas = () => new Set((S.settings.fixed || []).filter(f => f.area).map(f => f.area));
function subtractIv(base, cuts) {
  let out = base.map(x => [...x]);
  for (const [c1, c2] of cuts) {
    const next = [];
    for (const [a, b] of out) {
      if (c2 <= a || c1 >= b) { next.push([a, b]); continue; }
      if (c1 > a) next.push([a, c1]);
      if (c2 < b) next.push([c2, b]);
    }
    out = next;
  }
  return out.filter(([a, b]) => b - a >= 5);
}
const ivMin = iv => sum(iv, ([a, b]) => b - a);

const bucketOf = (k, area) => (area && containerAreas().has(area)) ? area : 'free';

function parseQuick(txt) {
  const td = todayKey();
  const r = { title: '', area: null, important: false, urgent: false, deadline: null, est: 0, recur: null, waitingFor: null };
  let t = ' ' + txt + ' ';
  const rm = (re, fn) => { t = t.replace(re, (...a) => { fn(...a); return ' '; }); };
  rm(/\s@([^\s#!@]+)(?=\s)/g, (m, w) => r.waitingFor = w);
  rm(/\s#(pr[aá]ce|work|p)(?=\s)/gi, () => r.area = 'prace');
  rm(/\s#(domov|doma|home|d)(?=\s)/gi, () => r.area = 'domov');
  rm(/\s#([sš]kola|school|s|š)(?=\s)/gi, () => r.area = 'skola');
  rm(/\s!!(?=\s)/g, () => { r.important = true; r.urgent = true; });
  rm(/\s!(?=\s)/g, () => r.important = true);
  rm(/\s(\d+(?:[.,]\d+)?)\s?(h|hod|hodin[ay]?|min|m)(?=\s)/gi, (m, n, u) => {
    const v = parseFloat(n.replace(',', '.')); r.est = Math.round(/^h/i.test(u) ? v * 60 : v);
  });
  rm(/\s(každ[ýy]\s+den|denně|denne)(?=\s)/gi, () => r.recur = 'daily');
  rm(/\s(každ[ýy]\s+týden|každ[ýy]\s+tyden|týdně|tydne)(?=\s)/gi, () => r.recur = 'weekly');
  rm(/\s(každ[ýy]\s+měsíc|každ[ýy]\s+mesic|měsíčně|mesicne)(?=\s)/gi, () => r.recur = 'monthly');
  const P = '(?:do\\s+|na\\s+|ve?\\s+)?';
  rm(new RegExp('\\s' + P + '(dnes|dneska)(?=\\s)', 'gi'), () => r.deadline = td);
  rm(new RegExp('\\s' + P + '(zítra|zitra|zítřka|zitrka)(?=\\s)', 'gi'), () => r.deadline = addDays(td, 1));
  rm(new RegExp('\\s' + P + '(pozítří|pozitri)(?=\\s)', 'gi'), () => r.deadline = addDays(td, 2));
  for (const [wd, names] of DAYMAP) {
    rm(new RegExp('\\s(?:do|na|ve?|příští|pristi)\\s+(' + names + ')(?=\\s)', 'gi'), () => {
      const cur = parseKey(td).getDay(); let diff = (wd - cur + 7) % 7; if (diff === 0) diff = 7;
      r.deadline = addDays(td, diff);
    });
  }
  rm(/\s(?:do\s+|na\s+)?(\d{1,2})\.\s?(\d{1,2})\.(\d{2,4})?(?=\s)/g, (m, d, mo, y) => {
    const now = new Date(); let yr = y ? Number(y.length === 2 ? '20' + y : y) : now.getFullYear();
    let k = dkey(new Date(yr, Number(mo) - 1, Number(d)));
    if (!y && k < td) k = dkey(new Date(yr + 1, Number(mo) - 1, Number(d)));
    r.deadline = k;
  });
  r.title = t.replace(/\s+/g, ' ').trim();
  return r;
}

// Rozloží zbývající (korigovaný) odhad úkolu do bloků mezi dneškem a termínem (s rezervou),
// s ohledem na kapacitu „kapsy“, kam úkol patří (pracovní doba / škola / volný čas).
function autoPlan(t, opts = {}) {
  const st = S.settings, td = todayKey(), len = opts.len || st.sessionLen;
  let remaining = t.est ? unplanned(t) : (t.sessions.length ? 0 : len);
  if (remaining <= 0) return { added: 0, msg: t.est ? 'Celý odhad už je rozplánovaný.' : 'Zadej odhad času, ať vím, kolik bloků naplánovat.' };
  let last;
  if (t.deadline) {
    last = addDays(t.deadline, -st.bufferDays);
    if (last < td) last = t.deadline < td ? td : t.deadline;
  } else last = addDays(td, 6);
  const days = [];
  for (let k = td; k <= last; k = addDays(k, 1)) days.push(k);
  if (days.length > 1 && nowMin() > toMin(st.dayEnd) - 60) days.shift();
  const load = {}, cap = {};
  for (const k of days) { const b = bucketOf(k, t.area); load[k] = bucketLoad(k, b); cap[k] = bucketCap(k, b); }
  const chunks = [];
  while (remaining > 0) {
    const c = Math.min(len, remaining);
    if (c < 15 && chunks.length) chunks[chunks.length - 1] += c; else chunks.push(c);
    remaining -= c;
  }
  const placed = [];
  for (const c of chunks) {
    const usable = days.filter(k => cap[k] > 0);
    const pool = usable.length ? usable : days;
    const fit = pool.filter(k => load[k] + c <= cap[k]);
    let best;
    if (fit.length) best = fit.reduce((x, y) => load[y] < load[x] ? y : x);
    else best = pool.reduce((x, y) => (load[y] - cap[y]) < (load[x] - cap[x]) ? y : x);
    load[best] += c; placed.push({ date: best, min: c });
  }
  placed.sort((a, b) => a.date.localeCompare(b.date));
  const labels = t.steps.filter(s => !s.done && !t.sessions.some(x => x.label === s.title)).map(s => s.title);
  placed.forEach((p, i) => addSession(t, p.date, p.min, null, labels[i] || ''));
  const over = [...new Set(placed.map(p => p.date))].filter(k => load[k] > cap[k]);
  const noRoom = !days.some(k => cap[k] > 0);
  return { added: placed.length, over, late: t.deadline && t.deadline < td, noRoom, factor: estFactor(t) };
}

// školní do školních bloků (pokud jsou v rozvrhu), ostatní do volného času.
function timeblock(k) {
  const st = S.settings, all = agenda(k);
  if (k < todayKey()) return { placed: 0, left: 0 };
  const busy = all.filter(x => x.s.start).map(x => [toMin(x.s.start), toMin(x.s.start) + x.s.min]);
  let from = toMin(st.dayStart);
  if (k === todayKey()) from = Math.max(from, Math.ceil((nowMin() + 5) / 5) * 5);
  const mit = peekDay(k).mit || [];
  const score = x => { const i = mit.indexOf(x.t.id); return (i >= 0 ? i : 10) * 1000 + quadrant(x.t) * 100 + (x.t.deadline ? Math.min(99, Math.max(0, diffDays(k, x.t.deadline))) : 99); };
  const todo = all.filter(x => !x.s.done && !x.s.start).sort((a, b) => score(a) - score(b));
  let placed = 0, left = 0;
  for (const x of todo) {
    const ivs = bucketIntervals(k, bucketOf(k, x.t.area));
    let ok = false;
    for (const [a, b] of ivs) {
      let t = Math.max(a, from), guard = 0;
      while (guard++ < 300) {
        const clash = busy.find(([p, q]) => t < q + st.breakLen && t + x.s.min + st.breakLen > p);
        if (!clash) break;
        t = clash[1] + st.breakLen;
      }
      if (t + x.s.min <= b) { x.s.start = fromMin(t); busy.push([t, t + x.s.min]); placed++; ok = true; break; }
    }
    if (!ok) left++;
  }
  return { placed, left };
}

  const noArea = UI.filter !== 'all' && UI.filter !== 'inbox' && UI.filter !== 'waiting';
  if (UI.showDone) {
    const list = S.tasks.filter(t => t.status === 'done' && match(t)).sort((a, b) => b.done - a.done).slice(0, 80);
    return h + `<div id="task-list">` + (list.length ? `<section class="block"><div class="list">${list.map(t => taskRow(t)).join('')}</div></section>` : emptyState('Zatím nic hotového', 'Odškrtnuté úkoly se objeví tady.')) + `</div>`;
  }
  if (UI.filter === 'waiting') {
    const w = openTasks().filter(t => isWaiting(t) && match(t)).sort((a, b) => (a.followUp || '9999').localeCompare(b.followUp || '9999'));
    return h + `<div id="task-list">${w.length ? `<section class="block"><div class="list">${w.map(t => taskRow(t)).join('')}</div></section><p class="hint">Ve dni připomenutí se úkol objeví na obrazovce Dnes.</p>` : emptyState('Na nic nečekáš', 'Když úkol předáš dál nebo čekáš na odpověď, vyplň v detailu „Čekám na“.')}</div>`;
  }
  const waitList = openTasks().filter(t => isWaiting(t) && match(t));
  const list = openTasks().filter(t => !isWaiting(t) && match(t));
  const groups = [['Po termínu', []], ['Dnes', []], ['Zítra', []], ['Tento týden', []], ['Později', []], ['Bez termínu', []]];
  for (const t of list) {
    if (!t.deadline) { groups[5][1].push(t); continue; }
    const d = diffDays(td, t.deadline);
    groups[d < 0 ? 0 : d === 0 ? 1 : d === 1 ? 2 : d <= 7 ? 3 : 4][1].push(t);
  }
  const sortFn = (a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999') || quadrant(a) - quadrant(b) || a.created - b.created;
  let body = '';
  for (const [name, arr] of groups) {
    if (!arr.length) continue;
    arr.sort(sortFn);
    body += `<section class="block"><div class="sec-h"><h2>${name}</h2><span class="n">${arr.length}</span></div><div class="list">${arr.map(t => taskRow(t, { noArea })).join('')}</div></section>`;
  }
  if (waitList.length) body += `<section class="block"><div class="sec-h"><h2>Čekám na</h2><span class="n">${waitList.length}</span></div><div class="list">${waitList.map(t => taskRow(t)).join('')}</div></section>`;
  if (!body) body = q ? emptyState('Nic nenalezeno', 'Zkus jiné slovo nebo jiný filtr.')
    : UI.filter === 'inbox' ? emptyState('Inbox je prázdný', 'Úkoly bez kategorie se sbírají tady. Při revizi je roztřiď.')
      : emptyState('Žádné otevřené úkoly', 'Zapiš, co tě čeká. Hlava je na nápady, ne na jejich skladování.', `<button class="btn primary" data-act="openAdd">${I.plus}Přidat úkol</button>`);
  return h + `<div id="task-list">${body}</div>`;
}

function planToast(res) {

  if (res.noRoom) { toast(m + '. Do termínu v rozvrhu není vhodný čas, zkontroluj pevné bloky.'); return; }

  else if (res.over && res.over.length) m += `. ${res.over.length} ${plural(res.over.length, 'den je', 'dny jsou', 'dní je')} přeplněných.`;

/* ===================== soustředění ===================== */
let audioCtx = null, focusTimer = null;
function beep() {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.0001, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .6);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .65);
  } catch (e) { }
}
function startFocus(taskId, sid) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch (e) { }
  const st = S.settings, f = findSession(sid);
  const dur = (f && !f.s.done ? Math.min(f.s.min, st.pomodoro) : st.pomodoro) * 60;
  S.focus = { taskId, sid: sid || null, mode: 'work', dur, endsAt: Date.now() + dur * 1000, left: null, logged: 0 };
  if (UI.sheet) { UI.sheet = null; renderSheet(); }
  save(); renderFocus();
}
const focusLeft = () => { const f = S.focus; if (!f) return 0; return f.endsAt ? Math.max(0, (f.endsAt - Date.now()) / 1000) : f.left; };
function finishWork(manual) {
  const f = S.focus; if (!f) return;
  const worked = Math.round((f.dur - focusLeft()) / 60);
  logFocus(task(f.taskId), worked);
  Object.assign(f, { mode: 'workDone', endsAt: null, left: 0, logged: worked });
  if (!manual) { beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { } }
  save(); renderFocus();
}
function renderFocus() {
  const root = $('#focus'), f = S.focus;
  clearInterval(focusTimer);
  if (!f) { root.classList.remove('open'); root.innerHTML = ''; document.title = 'Plánek'; return; }
  const t = task(f.taskId), x = f.sid && findSession(f.sid);
  if (!t) { S.focus = null; renderFocus(); return; }
  const running = !!f.endsAt, C = 2 * Math.PI * 46;
  let phase, btns;
  if (f.mode === 'work') {
    phase = running ? 'Soustředění' : 'Pozastaveno';
    btns = `${running ? `<button class="btn primary" data-act="fPause">${I.pause}Pauza</button>` : `<button class="btn primary" data-act="fResume">${I.play}Pokračovat</button>`}
      <button class="btn" data-act="fStop">Ukončit a zapsat čas</button><button class="btn" data-act="fCancel">Zrušit</button>`;
  } else if (f.mode === 'workDone') {
    phase = `Zapsáno ${fmtDur(f.logged)}`;
    btns = `<button class="btn primary" data-act="fBreak">Pauza ${S.settings.shortBreak} min</button><button class="btn" data-act="fNext">Další blok</button>${x && !x.s.done ? `<button class="btn" data-act="fSessionDone">${I.check}Blok hotový</button>` : ''}<button class="btn" data-act="fClose">Zavřít</button>`;
  } else if (f.mode === 'break') {
    phase = running ? 'Pauza: protáhni se, napij se, koukni z okna' : 'Pauza pozastavena';
    btns = `${running ? '' : `<button class="btn primary" data-act="fResume">${I.play}Pokračovat</button>`}<button class="btn" data-act="fNext">Přeskočit pauzu</button><button class="btn" data-act="fClose">Zavřít</button>`;
  } else {
    phase = 'Pauza skončila';
    btns = `<button class="btn primary" data-act="fNext">${I.play}Další blok</button>${x && !x.s.done ? `<button class="btn" data-act="fSessionDone">${I.check}Blok hotový</button>` : ''}<button class="btn" data-act="fClose">Zavřít</button>`;
  }
  root.innerHTML = `<div class="phase">${esc(phase)}</div><h2 class="ft">${esc(t.title)}</h2><p class="fl">${x && x.s.label ? esc(x.s.label) : esc(areaName(t.area))}</p>
    <div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bgc" cx="50" cy="50" r="46"/><circle class="fgc" id="f-ring" cx="50" cy="50" r="46" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="tm" id="f-time" role="timer" aria-live="off">00:00</div></div>
    <div class="fbtns">${btns}</div>`;
  root.classList.add('open');
  const tick = () => {
    const ff = S.focus; if (!ff) return;
    const left = focusLeft(), done = ff.mode === 'workDone' || ff.mode === 'breakDone';
    const shown = done ? 0 : Math.ceil(left);
    $('#f-time').textContent = `${pad(Math.floor(shown / 60))}:${pad(shown % 60)}`;
    $('#f-ring').setAttribute('stroke-dashoffset', String(done ? C : C * (1 - left / ff.dur)));
    if (ff.endsAt) document.title = `${pad(Math.floor(shown / 60))}:${pad(shown % 60)} – ${t.title}`;
    if (ff.endsAt && left <= 0) {
      if (ff.mode === 'work') finishWork(false);
      else if (ff.mode === 'break') { Object.assign(ff, { mode: 'breakDone', endsAt: null, left: 0 }); beep(); save(); renderFocus(); }
    }
  };
  tick(); if (running) focusTimer = setInterval(tick, 250);
}

    } catch (e) { if (e && e.name === 'AbortError') return; }

      setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Záloha stažena'); return;

}
